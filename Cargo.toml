[package]
name = "world-simulator"
version = "0.1.0"
authors = ["Sebastian Schmidt <isibboi@gmail.com>"]
repository = "https://github.com/ISibboI/world-simulator"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = { version = "0.10.3", features = ["chacha"] }

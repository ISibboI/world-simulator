[package]
name = "world-simulator"
version = "0.1.0"
authors = ["Sebastian Schmidt <isibboi@gmail.com>"]
repository = "https://github.com/ISibboI/world-simulator"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
glam = "0.34.3"
libm = "0.2.16"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = { version = "0.10.3", default-features = false, features = ["chacha", "std"] }
rustc-hash = "2.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-time = "1.1.0"

# The web version (see `src/web.rs` and `web/`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
tracing-web = "0.1.3"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "ErrorEvent",
    "EventTarget",
    "HtmlCanvasElement",
    "History",
    "HtmlElement",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Navigator",
    "Storage",
    "Window",
    "Worker",
    "WorkerLocation",
    "WorkerOptions",
    "WorkerType",
] }

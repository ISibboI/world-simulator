<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>World Simulator</title>
    <!-- The simulator (src/web.rs); the same module also runs the simulation in worker.js. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="world-simulator" data-wasm-opt="3">
    <link data-trunk rel="copy-file" href="worker.js">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #05050f;
            color: #c8c8d0;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* Looks like the view's status banner (src/viewer/banner.rs), which replaces it. */
        #status {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            box-sizing: border-box;
            padding: 0.3em 1em;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-size: 1.44rem;
            text-align: center;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <canvas id="world_simulator"></canvas>
    <div id="status">Loading…</div>
</body>
</html>

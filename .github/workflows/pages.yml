name: Web version

# Builds the web version (see Trunk.toml and web/) on every push and pull request, and deploys it
# to GitHub Pages on pushes to main (including merged pull requests).

on:
  push:
    # runs/* are temporary branches the agents' run scheduler pushes only so that the sweep
    # workflow can build a commit; they don't need CI or a pages build.
    branches-ignore: ["runs/**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the older run, including a deployment
# in progress (the newer run deploys the newer build anyway).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.22.2

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version

      - name: Build
        run: trunk build --release

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: Tests and Lints

on:
  push:
    # runs/* are temporary branches the agents' run scheduler pushes only so that the sweep
    # workflow can build a commit; they don't need CI or a pages build.
    branches-ignore: ["runs/**"]
    tags: ["**"]
  pull_request:

# Warnings are denied via CARGO_BUILD_WARNINGS=deny, which setup-rust-toolchain v2 sets by default.

jobs:
  rust_check:
    name: Rust check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: cargo check
        run: cargo check --all-targets --all-features

  rust_format:
    name: Rust format
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt

      - name: cargo format
        uses: actions-rust-lang/rustfmt@v1

  rust_check_default_features:
    name: Rust check with default features
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: cargo check
        run: cargo check --all-targets

  rust_lint:
    name: Rust lint
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true
      matrix:
        toolchain: [null, "stable", "beta", "nightly"]

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          toolchain: ${{ matrix.toolchain }}

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  rust_test:
    name: Rust test
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: cargo test
        run: cargo test --all-features

  rust_doc:
    name: Rust doc
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: cargo doc
        run: cargo doc --no-deps --all-features

  rust_check_os_compatibility:
    name: Rust check
    runs-on: ${{ matrix.runner }}
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true
      matrix:
        runner: [windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: cargo check
        run: cargo check --all-targets --all-features

  # The web version (src/web.rs, web/) is built for wasm32; checking and linting it here keeps the
  # shared code compiling for the browser. The site itself is built in pages.yml.
  rust_check_wasm:
    name: Rust check (wasm)
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          target: wasm32-unknown-unknown

      - name: cargo check
        run: cargo check --all-targets --all-features --target wasm32-unknown-unknown

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --target wasm32-unknown-unknown

  # macOS is checked by cross-checking from Linux instead of on a macOS runner: hosted macOS
  # (arm64) runners are often unavailable, and jobs waiting for one get cancelled after
  # ~15 min ("The job was not acquired by Runner of type hosted even after multiple attempts").
  # `cargo check` does not link, so the Rust target's standard library is all it needs.
  rust_check_macos:
    name: Rust check (macOS)
    runs-on: ubuntu-latest
    needs: ["rust_check", "rust_format"]

    strategy:
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: cargo check
        run: cargo check --all-targets --all-features --target ${{ matrix.target }}
